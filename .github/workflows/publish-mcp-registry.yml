name: Publish to Official MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml

permissions:
  contents: read

jobs:
  publish:
    name: Publish Browser Core remote MCP metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 12
    steps:
      - name: Checkout documented server
        uses: actions/checkout@v4
      - name: Install verified MCP publisher v1.8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz"
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x ./mcp-publisher
      - name: Validate server metadata
        run: ./mcp-publisher validate ./server.json
      - name: Authenticate to registry using GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish Browser Core metadata
        run: ./mcp-publisher publish ./server.json
