name: Public release consistency
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - RELEASE.json
      - RELEASE_SHA256.txt
      - scripts/verify-release.py
      - .github/workflows/release-consistency.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check live public distribution
        run: python scripts/verify-release.py
