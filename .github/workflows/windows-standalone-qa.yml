name: Windows standalone browser beta QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-standalone-qa.yml
      - RELEASE.json
permissions:
  contents: read
jobs:
  smoke:
    name: Windows real Chromium smoke test 0.8.4
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch publisher ZIP with pinned SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://browser.m2g.pro/downloads/BrowserCore-Windows-Standalone-0.8.4-beta.zip'
          Invoke-WebRequest -Uri $uri -OutFile "$env:RUNNER_TEMP\worker.zip"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\worker.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '646ca5cd6dc37a200657ee5df55ad7b40eae7713208f2ef7fdf00080c743a54b'
          if ($actual -ne $expected) { throw 'Worker package SHA256 mismatch' }
          Expand-Archive -Path "$env:RUNNER_TEMP\worker.zip" -DestinationPath "$env:RUNNER_TEMP\browsercore" -Force
          $root = "$env:RUNNER_TEMP\browsercore"
          if (!(Test-Path "$root\core.py")) { throw 'core.py is missing' }
          if (!(Test-Path "$root\hybrid\smoke.py")) { throw 'smoke.py is missing' }
          echo "BC_PACKAGE_PATH=$root" >> $env:GITHUB_ENV
      - name: Install requirements and bundled Chromium
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r "$env:BC_PACKAGE_PATH\requirements-agent.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m playwright install chromium --only-shell
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
      - name: Actual Windows browser automation smoke
        shell: pwsh
        run: |
          Set-Location "$env:BC_PACKAGE_PATH"
          $env:PYTHONPATH = "$env:BC_PACKAGE_PATH"
          python -m hybrid.smoke
          if ($LASTEXITCODE -ne 0) { throw 'Windows Chromium smoke failed' }
      - name: Confirm agent version and Windows bridge guard
        shell: pwsh
        run: |
          Set-Location "$env:BC_PACKAGE_PATH"
          $env:PYTHONPATH = "$env:BC_PACKAGE_PATH"
          $source = Get-Content '.\hybrid\agent.py' -Raw
          if (!$source.Contains("if os.name != 'nt':")) { throw 'Windows bridge guard missing' }
          python -c "from hybrid.status import VERSION; assert VERSION == '0.7.18-beta'; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Agent version mismatch' }
          Write-Host 'Existing Windows Chrome tab attachment remains unsupported.'
